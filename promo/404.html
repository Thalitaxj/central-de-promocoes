<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Central de Promoções</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Poppins", system-ui, sans-serif; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
      background: linear-gradient(115deg, #FF6A00 0%, #9a4a2e 36%, #19406b 58%, #062B59 100%);
    }
    .box {
      background: rgba(10,26,48,.55); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 26px;
      padding: 48px 40px; max-width: 460px; box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 { font-size: 72px; font-weight: 800; color: #FFC43D; line-height: 1; }
    h2 { font-size: 22px; font-weight: 600; margin: 10px 0 8px; }
    p { color: #b7cbe0; font-size: 15px; margin-bottom: 24px; }
    a {
      display: inline-block; text-decoration: none; color: #fff; font-weight: 600;
      background: linear-gradient(135deg, #FF8A3D, #FF6A00);
      padding: 13px 26px; border-radius: 14px; box-shadow: 0 8px 18px rgba(255,106,0,.4);
      transition: filter .2s;
    }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>A página que você procura não existe ou foi movida.</p>
    <a href="/">Voltar para a loja</a>
  </div>
</body>
</html>
